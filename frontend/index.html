
<!DOCTYPE html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#09090b" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="description" content="NEXUS - Premium University Attendance & Class Management" />
    
    <link rel="icon" type="image/svg+xml" href="https://cdn-icons-png.flaticon.com/512/3135/3135715.png" />
    <link rel="apple-touch-icon" href="https://cdn-icons-png.flaticon.com/512/3135/3135715.png" />
    <link rel="manifest" href="/manifest.json" />
    
    <title>NEXUS | Academic Suite</title>
    <style>
      /* Initial Splash Screen Styles */
      body { margin: 0; background-color: #09090b; }
      #root { height: 100vh; }
      .splash-screen {
        position: fixed; top: 0; left: 0; width: 100%; height: 100%;
        background: #09090b; display: flex; align-items: center; justify-content: center; z-index: 9999;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js').then(reg => console.log('SW Registered', reg.scope));
        });
      }
    </script>
  </body>
</html>
